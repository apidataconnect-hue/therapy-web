server {
    listen 80;
    listen [::]:80;
    server_name psychotherapyconnect.com www.psychotherapyconnect.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name psychotherapyconnect.com www.psychotherapyconnect.com;

    ssl_certificate     /etc/letsencrypt/live/psychotherapyconnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psychotherapyconnect.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy /api → backend
    location /api/ {
        proxy_pass         https://api.apidataconnect.com/api/;
        proxy_set_header   Host              api.apidataconnect.com;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Serve Nuxt node server (running on port 3000)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
